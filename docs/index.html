<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Verity — Verificación pública</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%230B0B0F'/%3E%3Ctext x='50' y='63' font-family='Arial,sans-serif' font-size='32' font-weight='800' fill='white' text-anchor='middle'%3EVRT%3C/text%3E%3C/svg%3E" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  /* Oscuro por defecto (identidad principal de Verity — ver
     app/theme/palette.ts). Mismos tokens que la app, solo renombrados
     a --bg/--surface porque aquí "bg" es la página y "surface" la
     tarjeta (al revés de los nombres en la app, incluye la nota). */
  :root {
    --bg: #0B0B0F;
    --surface: #1C1C24;
    --surface-alt: #26262F;
    --border: #33333D;
    --border-soft: #2A2A33;
    --text: #F2F2F5;
    --text-muted: #9A9AA5;
    --text-faint: #6B6B76;
    --accent: #4C9AFF;
    --accent-dim: #2C5C9C;
    --accent-ink: #0B0B0F;
    --success: #3DD16F;
    --danger: #F16A5C;
    /* El sello flotante siempre debe ser lo opuesto al fondo de la
       página para resaltar — blanco sobre oscuro, negro sobre claro. */
    --seal-bg: #ffffff;
    --seal-text: #0B0B0F;
    --chip-bg: rgba(28,28,36,0.75);
  }

  @media (prefers-color-scheme: light) {
    :root:not([data-theme="dark"]) {
      --bg: #F4F6F9;
      --surface: #FFFFFF;
      --surface-alt: #EEF2F7;
      --border: #E2E5EA;
      --border-soft: #E7EAEE;
      --text: #111114;
      --text-muted: #63666E;
      --text-faint: #9AA0A8;
      --accent: #1A73E8;
      --accent-dim: #AFCBF3;
      --accent-ink: #FFFFFF;
      --success: #1E8E3E;
      --danger: #C0392B;
      --seal-bg: #0B0B0F;
      --seal-text: #ffffff;
      --chip-bg: rgba(255,255,255,0.75);
    }
  }
  :root[data-theme="light"] {
    --bg: #F4F6F9;
    --surface: #FFFFFF;
    --surface-alt: #EEF2F7;
    --border: #E2E5EA;
    --border-soft: #E7EAEE;
    --text: #111114;
    --text-muted: #63666E;
    --text-faint: #9AA0A8;
    --accent: #1A73E8;
    --accent-dim: #AFCBF3;
    --accent-ink: #FFFFFF;
    --success: #1E8E3E;
    --danger: #C0392B;
    --seal-bg: #0B0B0F;
    --seal-text: #ffffff;
    --chip-bg: rgba(255,255,255,0.75);
  }
  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: "Sora", -apple-system, "Segoe UI", sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .mono { font-family: "JetBrains Mono", ui-monospace, Consolas, monospace; }
  h1, h2, h3 { text-wrap: balance; }
  a { color: var(--accent); }

  /* ---------- Selector de idioma ---------- */
  .lang-switch {
    display: flex;
    background: var(--chip-bg);
    backdrop-filter: blur(8px);
    border: 1px solid var(--border);
    border-radius: 999px;
    padding: 3px;
    gap: 2px;
  }
  .lang-switch button {
    border: none;
    background: transparent;
    color: var(--text-muted);
    font-family: "JetBrains Mono", monospace;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.03em;
    padding: 6px 12px;
    border-radius: 999px;
    cursor: pointer;
  }
  .lang-switch button.active { background: var(--accent); color: var(--accent-ink); }

  .top-controls {
    position: fixed;
    top: 16px; right: 16px;
    z-index: 10;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .theme-toggle {
    width: 32px; height: 32px;
    border-radius: 50%;
    border: 1px solid var(--border);
    background: var(--chip-bg);
    backdrop-filter: blur(8px);
    color: var(--text-muted);
    display: flex; align-items: center; justify-content: center;
    cursor: pointer;
  }

  /* ---------- Hero ---------- */
  .hero {
    position: relative;
    padding: 72px 24px 108px;
    overflow: hidden;
    background:
      radial-gradient(ellipse 900px 500px at 50% -10%, rgba(76,154,255,0.16), transparent 60%),
      var(--bg);
    text-align: center;
  }
  .hero-photo-frame {
    position: relative;
    width: 100%;
    max-width: 560px;
    aspect-ratio: 16 / 7;
    margin: 0 auto 34px;
    border-radius: 22px;
    overflow: hidden;
    border: 1px solid var(--border-soft);
    box-shadow: 0 30px 60px -30px rgba(76,154,255,0.35), 0 0 0 1px rgba(255,255,255,0.02) inset;
  }
  .hero-photo-frame img {
    width: 100%; height: 100%; object-fit: cover; display: block;
    filter: saturate(1.05);
  }
  .hero-photo-frame::after {
    content: "";
    position: absolute; inset: 0;
    background: linear-gradient(180deg, rgba(11,11,15,0) 35%, rgba(11,11,15,0.92) 100%);
  }
  .eyebrow {
    display: inline-flex; align-items: center; gap: 8px;
    font-family: "JetBrains Mono", monospace;
    font-size: 11px; font-weight: 600; letter-spacing: 0.16em; text-transform: uppercase;
    color: var(--accent);
    margin-bottom: 18px;
  }
  .eyebrow::before, .eyebrow::after { content: ""; width: 20px; height: 1px; background: var(--accent-dim); }
  h1 {
    font-size: clamp(28px, 5.2vw, 44px);
    font-weight: 800;
    letter-spacing: -0.015em;
    margin: 0 0 14px;
    line-height: 1.1;
  }
  .hero-lede {
    color: var(--text-muted);
    font-size: 15px;
    line-height: 1.7;
    max-width: 46ch;
    margin: 0 auto;
  }

  /* Insignia flotante entre el hero y el contenido — mismo truco visual
     que el paywall de la app (insignia partida entre dos secciones). */
  .seal-badge {
    display: block;
    width: 92px; height: 92px;
    margin: -46px auto 40px;
    position: relative;
    z-index: 2;
    filter: drop-shadow(0 12px 24px rgba(0,0,0,0.5));
  }

  /* ---------- Body ---------- */
  .wrap { max-width: 620px; margin: 0 auto; padding: 0 20px 90px; }

  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 22px;
    padding: 26px 24px;
    margin-bottom: 22px;
    position: relative;
  }
  .section-title {
    display: flex; align-items: center; gap: 9px;
    font-weight: 700; font-size: 16.5px; margin: 0 0 8px; letter-spacing: -0.005em;
  }
  .section-title svg { flex-shrink: 0; color: var(--accent); }
  .section-sub { color: var(--text-muted); font-size: 13.5px; margin-bottom: 20px; line-height: 1.55; }

  input[type="text"] {
    width: 100%;
    background: var(--surface-alt);
    border: 1px solid var(--border);
    color: var(--text);
    border-radius: 13px;
    padding: 14px 15px;
    font-size: 14px;
    font-family: "JetBrains Mono", monospace;
    margin-bottom: 12px;
    transition: border-color 0.15s;
  }
  input[type="text"]::placeholder { color: var(--text-faint); font-family: "Sora", sans-serif; }
  input[type="text"]:focus { outline: none; border-color: var(--accent); }

  .input-row { position: relative; }
  .input-row input[type="text"] { padding-right: 40px; }
  .clear-btn {
    position: absolute; top: 50%; right: 10px; transform: translateY(-50%);
    margin-top: -6px;
    width: 26px; height: 26px;
    border-radius: 50%; border: none;
    background: var(--border); color: var(--text-muted);
    font-size: 12px; line-height: 1;
    cursor: pointer;
  }
  .clear-btn[hidden] { display: none; }

  .file-drop {
    display: block;
    border: 1.5px dashed var(--border);
    border-radius: 16px;
    padding: 30px 20px;
    text-align: center;
    cursor: pointer;
    transition: border-color 0.15s, background 0.15s;
  }
  .file-drop:hover, .file-drop.drag { border-color: var(--accent); background: rgba(76,154,255,0.05); }
  .file-drop input { display: none; }
  .file-drop-icon { font-size: 22px; margin-bottom: 8px; opacity: 0.85; }
  .file-drop-label { font-size: 13.5px; color: var(--text-muted); }
  .file-drop-hint { font-size: 11.5px; color: var(--text-faint); margin-top: 4px; }

  button.primary {
    width: 100%;
    background: var(--accent);
    color: var(--accent-ink);
    border: none;
    border-radius: 14px;
    padding: 15px;
    font-weight: 700;
    font-size: 14.5px;
    font-family: "Sora", sans-serif;
    cursor: pointer;
    transition: transform 0.1s, opacity 0.15s;
  }
  button.primary:hover { opacity: 0.92; }
  button.primary:active { transform: scale(0.99); }
  button.primary:disabled { opacity: 0.55; cursor: default; }

  .result {
    margin-top: 18px;
    border-radius: 14px;
    padding: 16px 17px;
    border: 1px solid var(--border);
    font-size: 13.5px;
    line-height: 1.6;
    background: var(--surface-alt);
    animation: rise 0.25s ease-out;
  }
  @keyframes rise { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
  .result-head { display: flex; align-items: center; gap: 9px; font-weight: 700; margin-bottom: 10px; }
  .result.ok { border-color: rgba(61,209,111,0.4); }
  .result.ok .result-head { color: var(--success); }
  .result.bad { border-color: rgba(241,106,92,0.35); }
  .result.bad .result-head { color: var(--danger); }
  .result-dot { width: 8px; height: 8px; border-radius: 50%; background: currentColor; flex-shrink: 0; }
  .row { display: flex; justify-content: space-between; gap: 12px; padding: 6px 0; border-top: 1px solid var(--border); font-size: 13px; }
  .row:first-of-type { border-top: none; padding-top: 0; }
  .row b { color: var(--text-muted); font-weight: 500; flex-shrink: 0; }
  .row span { color: var(--text); text-align: right; }
  .row a { text-decoration: none; font-weight: 600; }
  .result-plain { color: var(--text-muted); margin: 0; }
  .hash-chip {
    font-family: "JetBrains Mono", monospace;
    font-size: 11.5px;
    word-break: break-all;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 8px 10px;
    margin-top: 8px;
    color: var(--text);
  }

  .spinner {
    display: inline-block; width: 14px; height: 14px;
    border: 2px solid var(--border); border-top-color: var(--accent);
    border-radius: 50%; animation: spin 0.7s linear infinite; flex-shrink: 0;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  footer {
    text-align: center; color: var(--text-faint); font-size: 12px;
    padding-top: 8px;
  }
  footer a { color: var(--text-muted); }
  footer .dot { margin: 0 8px; opacity: 0.5; }
  .link-btn {
    background: none; border: none; padding: 0;
    color: var(--text-muted); text-decoration: underline;
    font-size: 12px; font-family: "Sora", sans-serif; cursor: pointer;
  }

  .modal-backdrop {
    display: none;
    position: fixed; inset: 0; z-index: 20;
    background: rgba(0,0,0,0.6);
    align-items: center; justify-content: center;
    padding: 20px;
  }
  .modal-backdrop.open { display: flex; }
  .modal-card {
    position: relative;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 30px 26px;
    max-width: 480px;
    max-height: 80vh;
    overflow-y: auto;
  }
  .modal-card h3 { margin: 0 0 14px; font-size: 17px; }
  .modal-card p { color: var(--text-muted); font-size: 13px; line-height: 1.65; margin: 0 0 12px; }
  .modal-card p:last-child { margin-bottom: 0; }
  .modal-close {
    position: absolute; top: 14px; right: 14px;
    width: 28px; height: 28px; border-radius: 50%;
    border: 1px solid var(--border); background: var(--surface-alt);
    color: var(--text-muted); cursor: pointer;
  }
</style>
</head>

    set(key, value) { try { localStorage.setItem(key, value); } catch {} },
  };

  let lang = safeStorage.get('verity_lang') || (navigator.language.startsWith('es') ? 'es' : 'en');
  const t = (key) => STRINGS[lang][key];

  // ---------------- Tema (claro/oscuro) ----------------
  // Igual que la app (ver ThemeContext.tsx): sin preferencia guardada,
  // sigue el sistema; con una elección explícita, esa gana siempre.
  const SUN_PATH = '<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>';
  const MOON_PATH = '<path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/>';
  const themeIcon = document.getElementById('themeIcon');

  function effectiveTheme() {
    const stored = safeStorage.get('verity_page_theme');
    if (stored) return stored;
    return window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
  }

  function applyTheme() {
    const stored = safeStorage.get('verity_page_theme');
    if (stored) document.documentElement.setAttribute('data-theme', stored);
    else document.documentElement.removeAttribute('data-theme');
    // El ícono muestra hacia qué modo cambiarías al tocarlo (sol si
    // estás en oscuro, luna si estás en claro) — mismo lenguaje que un
    // interruptor de luz, no "qué modo es este".
    themeIcon.innerHTML = effectiveTheme() === 'dark' ? SUN_PATH : MOON_PATH;
  }

  document.getElementById('themeToggle').addEventListener('click', () => {
    const next = effectiveTheme() === 'dark' ? 'light' : 'dark';
    safeStorage.set('verity_page_theme', next);
    applyTheme();
  });

  applyTheme();

  // El último resultado se guarda tal cual (no el HTML ya armado) para
  // poder volver a dibujarlo en el otro idioma sin repetir la consulta.
  let lastFileState = { kind: 'idle' };
  let lastTxState = { kind: 'idle' };

  function applyStaticText() {
    document.documentElement.lang = lang;
    document.querySelectorAll('[data-i18n]').forEach((el) => {
      el.textContent = t(el.getAttribute('data-i18n'));
    });
    document.getElementById('langEs').classList.toggle('active', lang === 'es');
    document.getElementById('langEn').classList.toggle('active', lang === 'en');
    renderFileResult();
    renderTxResult();
  }

  function setLang(next) {
    lang = next;
    safeStorage.set('verity_lang', lang);
    applyStaticText();
  }

  document.getElementById('langEs').addEventListener('click', () => setLang('es'));
  document.getElementById('langEn').addEventListener('click', () => setLang('en'));

  // ---------------- Lógica de verificación ----------------
  const fileDrop = document.getElementById('fileDrop');
  const fileInput = document.getElementById('fileInput');
  const fileDropLabel = document.getElementById('fileDropLabel');
  const fileResultEl = document.getElementById('fileResult');
  const txInput = document.getElementById('txInput');
  const txButton = document.getElementById('txButton');
  const txResultEl = document.getElementById('txResult');

  function bufferToHex(buffer) {
    return Array.from(new Uint8Array(buffer)).map((b) => b.toString(16).padStart(2, '0')).join('');
  }

  async function hashFile(file) {
    const buffer = await file.arrayBuffer();
    const digest = await crypto.subtle.digest('SHA-256', buffer);
    return '0x' + bufferToHex(digest);
  }

  async function lookupPublicIndex(hash) {
    const res = await fetch(
      `${SUPABASE_URL}/rest/v1/certificates?sha256=eq.${encodeURIComponent(hash)}&select=*`,
      { headers: { apikey: SUPABASE_ANON_KEY, Authorization: `Bearer ${SUPABASE_ANON_KEY}` } }
    );
    if (!res.ok) throw new Error('index request failed');
    const rows = await res.json();
    return rows[0] ?? null;
  }

  function renderFileResult() {
    const s = lastFileState;
    if (s.kind === 'idle') { fileResultEl.innerHTML = ''; return; }
    if (s.kind === 'loading') {
      fileResultEl.innerHTML = `<div class="result"><span class="spinner"></span> &nbsp;${t('calculating')}</div>`;
      return;
    }
    if (s.kind === 'found') {
      const e = s.entry;
      fileResultEl.innerHTML = `
        <div class="result ok">
          <div class="result-head"><span class="result-dot"></span> ${t('fileFoundTitle')}</div>
          <div class="row"><b>${t('trustLevel')}</b><span>${t('trustValues')[e.trust_level] ?? e.trust_level}</span></div>
          ${e.sequence_number ? `<div class="row"><b>${t('sealNumber')}</b><span class="mono">${e.sequence_number}</span></div>` : ''}
          <div class="row"><b>${t('sealedOn')}</b><span>${new Date(e.sealed_at).toLocaleString()}</span></div>
          <div class="row"><b>${t('registry')}</b><span><a href="${EXPLORER(e.tx_hash)}" target="_blank" rel="noopener">Polygonscan ↗</a></span></div>
        </div>`;
      return;
    }
    if (s.kind === 'not-found') {
      fileResultEl.innerHTML = `
        <div class="result bad">
          <div class="result-head"><span class="result-dot"></span> ${t('fileNotFoundTitle')}</div>
          <p class="result-plain">${t('fileNotFoundBody')}</p>
        </div>`;
      return;
    }
    if (s.kind === 'error') {
      fileResultEl.innerHTML = `<div class="result bad"><div class="result-head"><span class="result-dot"></span> ${t('verifyErrorTitle')}</div><p class="result-plain">${s.message}</p></div>`;
    }
  }

  function renderTxResult() {
    const s = lastTxState;
    if (s.kind === 'idle') { txResultEl.innerHTML = ''; return; }
    if (s.kind === 'loading') {
      txResultEl.innerHTML = `<div class="result"><span class="spinner"></span> &nbsp;${t('querying')}</div>`;
      return;
    }
    if (s.kind === 'invalid') {
      txResultEl.innerHTML = `<div class="result bad"><div class="result-head"><span class="result-dot"></span> ${t('invalidSealTitle')}</div><p class="result-plain">${t('invalidSealBody')}</p></div>`;
      return;
    }
    if (s.kind === 'found') {
      txResultEl.innerHTML = `
        <div class="result ok">
          <div class="result-head"><span class="result-dot"></span> ${t('txFoundTitle')}</div>
          <div class="row"><b>${t('anchoredHash')}</b></div>
          <div class="hash-chip">${s.input}</div>
          <div class="row" style="margin-top:8px"><b>${t('registry')}</b><span><a href="${EXPLORER(s.txHash)}" target="_blank" rel="noopener">Polygonscan ↗</a></span></div>
        </div>`;
      return;
    }
    if (s.kind === 'not-found') {
      txResultEl.innerHTML = `<div class="result bad"><div class="result-head"><span class="result-dot"></span> ${t('txNotFoundTitle')}</div><p class="result-plain">${t('txNotFoundBody')}</p></div>`;
      return;
    }
    if (s.kind === 'error') {
      txResultEl.innerHTML = `<div class="result bad"><div class="result-head"><span class="result-dot"></span> ${t('queryErrorTitle')}</div><p class="result-plain">${s.message}</p></div>`;
    }
  }

  ['dragover', 'dragleave', 'drop'].forEach((evt) => {
    fileDrop.addEventListener(evt, (e) => {
      e.preventDefault();
      fileDrop.classList.toggle('drag', evt === 'dragover');
      if (evt === 'drop' && e.dataTransfer.files[0]) {
        fileInput.files = e.dataTransfer.files;
        fileInput.dispatchEvent(new Event('change'));
      }
    });
  });

  fileInput.addEventListener('change', async () => {
    const file = fileInput.files[0];
    if (!file) return;
    fileDropLabel.textContent = file.name;
    lastFileState = { kind: 'loading' };
    renderFileResult();

    try {
      const hash = await hashFile(file);
      const entry = await lookupPublicIndex(hash);
      lastFileState = entry ? { kind: 'found', entry } : { kind: 'not-found' };
    } catch (error) {
      lastFileState = { kind: 'error', message: error.message };
    }
    renderFileResult();
  });

  async function lookupOnChain(txHash) {
    const res = await fetch(AMOY_RPC_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ jsonrpc: '2.0', id: 1, method: 'eth_getTransactionByHash', params: [txHash] }),
    });
    const json = await res.json();
    return json.result ?? null;
  }

  async function runSealSearch() {
    const seal = txInput.value.trim();
    if (!/^0x[0-9a-fA-F]{64}$/.test(seal)) {
      lastTxState = { kind: 'invalid' };
      renderTxResult();
      return;
    }

    lastTxState = { kind: 'loading' };
    renderTxResult();
    try {
      const tx = await lookupOnChain(seal);
      lastTxState = tx && tx.input && tx.input !== '0x'
        ? { kind: 'found', input: tx.input, txHash: seal }
        : { kind: 'not-found' };
    } catch (error) {
      lastTxState = { kind: 'error', message: error.message };
    }
    renderTxResult();
  }

  txButton.addEventListener('click', runSealSearch);

  // El botón "✕" y la búsqueda en vivo, igual que en la app
  // (VerificationScreen.tsx): cualquier cambio en el texto limpia el
  // resultado anterior de inmediato (nunca queda pegado sin relación
  // con lo que hay en el campo), y si queda escrito un número de sello
  // completo y válido (0x + 64 caracteres — lo normal al pegar uno) se
  // busca solo, sin tener que tocar "Buscar en el registro".
  const txClear = document.getElementById('txClear');
  let txDebounce = null;

  function updateTxClearVisibility() {
    txClear.hidden = txInput.value.length === 0;
  }

  txInput.addEventListener('input', () => {
    updateTxClearVisibility();
    lastTxState = { kind: 'idle' };
    renderTxResult();

    if (txDebounce) clearTimeout(txDebounce);
    const trimmed = txInput.value.trim();
    if (/^0x[0-9a-fA-F]{64}$/.test(trimmed)) {
      txDebounce = setTimeout(runSealSearch, 400);
    }
  });

  txClear.addEventListener('click', () => {
    txInput.value = '';
    updateTxClearVisibility();
    lastTxState = { kind: 'idle' };
    renderTxResult();
    txInput.focus();
  });

  applyStaticText();

  // ---------------- Privacidad (modal simple) ----------------
  const privacyBackdrop = document.getElementById('privacyBackdrop');
  document.getElementById('privacyOpen').addEventListener('click', () => privacyBackdrop.classList.add('open'));
  document.getElementById('privacyClose').addEventListener('click', () => privacyBackdrop.classList.remove('open'));
  privacyBackdrop.addEventListener('click', (e) => {
    if (e.target === privacyBackdrop) privacyBackdrop.classList.remove('open');
  });
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') privacyBackdrop.classList.remove('open');
  });
</script>
</body>
</html>
